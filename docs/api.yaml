openapi: 3.1.0
info:
  title: WallAce API
  version: 0.2.0
  description: |
    HTTP API and dashboard WebSocket contract for WallAce.

    Device routes under `/api/devices` require a shared bearer token
    (`Authorization: Bearer <token>`). Health and dashboard WebSocket routes are open.
    The `device_id` path parameter is the ESP32 factory MAC address (e.g. `A4:CF:12:34:56:78`).
servers:
  - url: /
    description: Local API service
paths:
  /api/health/live:
    get:
      summary: Check whether the API process is alive
      description: Implemented. This check does not depend on external services.
      operationId: getLiveness
      responses:
        "200":
          description: The API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/health/ready:
    get:
      summary: Check whether the API is ready to serve requests
      description: Implemented. Readiness requires a successful PostgreSQL connection.
      operationId: getReadiness
      responses:
        "200":
          description: The API is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The API cannot reach PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/devices:
    get:
      summary: List known devices
      description: Implemented. Returns every device the API has seen, ordered by first contact.
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
  /api/devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    patch:
      summary: Rename a device
      description: Implemented. Updates the user-facing label; empty clears it back to the MAC.
      operationId: renameDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceNameInput"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
  /api/devices/{device_id}/detections:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      summary: Record a motion detection from a device
      description: Implemented. The API broadcasts a `detection` event to connected dashboards.
      operationId: createDetection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionInput"
      responses:
        "201":
          description: Detection recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detection"
        "400":
          description: Invalid request body
    get:
      summary: List device detections
      description: Implemented. Newest first.
      operationId: listDetections
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Detection history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Detection"
  /api/devices/{device_id}/config:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      summary: Get actuator configuration for a device
      description: Implemented. Firmware polls this endpoint every 3–5 seconds.
      operationId: getDeviceConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current device configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
    put:
      summary: Update actuator configuration
      description: Implemented.
      operationId: updateDeviceConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfig"
      responses:
        "200":
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
  /api/devices/{device_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      summary: Record a device heartbeat
      description: Implemented. Firmware should send this every 15–30 seconds.
      operationId: createDeviceHeartbeat
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Heartbeat recorded
  /api/devices/{device_id}/status:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      summary: Get current device status
      description: Implemented. `online` is derived from the last heartbeat (within 60 seconds).
      operationId: getDeviceStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current online state and actuator configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
x-websockets:
  /ws/dashboard:
    description: Implemented. Open, push-only.
    direction: API service to dashboard
    messages:
      - name: detection
        contentType: application/json
        description: Sent when the API receives a motion detection.
        payload:
          $ref: "#/components/schemas/DashboardDetectionEvent"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Device MAC address, e.g. `A4:CF:12:34:56:78`.
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    DeviceNameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: User-facing label; empty falls back to the MAC address.
    Device:
      type: object
      required: [device_id, name, led_enabled, buzzer_enabled, online, last_heartbeat]
      properties:
        device_id:
          type: string
          description: Device MAC address.
        name:
          type: string
        led_enabled:
          type: boolean
        buzzer_enabled:
          type: boolean
        online:
          type: boolean
        last_heartbeat:
          type: [integer, "null"]
          description: Unix timestamp in seconds; null before the first heartbeat.
    DetectionInput:
      type: object
      required: [ts]
      properties:
        ts:
          type: integer
          description: Unix timestamp in seconds
          example: 1732300000
    Detection:
      allOf:
        - $ref: "#/components/schemas/DetectionInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
    DeviceConfig:
      type: object
      required: [led_enabled, buzzer_enabled]
      properties:
        led_enabled:
          type: boolean
        buzzer_enabled:
          type: boolean
    DeviceStatus:
      allOf:
        - $ref: "#/components/schemas/DeviceConfig"
        - type: object
          required: [online, last_heartbeat]
          properties:
            online:
              type: boolean
            last_heartbeat:
              type: [integer, "null"]
              description: Unix timestamp in seconds; null before the first heartbeat.
    DashboardDetectionEvent:
      type: object
      required: [type, device_id, ts]
      properties:
        type:
          type: string
          const: detection
        device_id:
          type: string
        ts:
          type: integer
          description: Unix timestamp in seconds
