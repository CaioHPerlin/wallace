openapi: 3.1.0
info:
  title: WallAce API
  version: 0.2.0
  description: |
    HTTP API and dashboard WebSocket contract for WallAce.

    Device routes require the shared `API_TOKEN`. Click **Authorize**, enter the
    token without the `Bearer` prefix, confirm **Authorize**, then close the dialog. The default local
    Compose token is `dev-token`, unless overridden in `.env`. There is no
    username/password login. Health and dashboard WebSocket routes are open.

    Start with `POST /api/devices/{device_id}/heartbeat`, then `GET /api/devices`.
    An empty list means no devices have contacted the API yet.
    The `device_id` path parameter is the ESP32 factory MAC address (e.g. `A4:CF:12:34:56:78`).
servers:
  - url: /
    description: Current origin (API directly or dashboard proxy)
tags:
  - name: Health
    description: Public checks for the API process and PostgreSQL connection.
  - name: Devices
    description: List devices, rename them, send heartbeats, and check online status.
  - name: Configuration
    description: Read or change LED and buzzer settings. Firmware polls every 3–5 seconds.
  - name: Detections
    description: Record motion events and browse their history. New events are pushed to dashboards.
paths:
  /api/health/live:
    get:
      summary: Check whether the API process is alive
      description: Implemented. This check does not depend on external services.
      tags: [Health]
      operationId: getLiveness
      responses:
        "200":
          description: The API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/health/ready:
    get:
      summary: Check whether the API is ready to serve requests
      description: Implemented. Readiness requires a successful PostgreSQL connection.
      tags: [Health]
      operationId: getReadiness
      responses:
        "200":
          description: The API is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The API cannot reach PostgreSQL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/devices:
    get:
      summary: List known devices
      description: Implemented. Returns every device the API has seen, ordered by first contact.
      tags: [Devices]
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
  /api/devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    patch:
      summary: Rename a device
      description: Implemented. Updates the user-facing label; empty clears it back to the MAC.
      tags: [Devices]
      operationId: renameDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceNameInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
  /api/devices/{device_id}/detections:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      summary: Record a motion detection from a device
      description: Implemented. The API broadcasts a `detection` event to connected dashboards.
      tags: [Detections]
      operationId: createDetection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionInput"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "201":
          description: Detection recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detection"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      summary: List device detections
      description: Implemented. Newest first.
      tags: [Detections]
      operationId: listDetections
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Detection history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Detection"
  /api/devices/{device_id}/config:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      summary: Get actuator configuration for a device
      description: Implemented. Firmware polls this endpoint every 3–5 seconds.
      tags: [Configuration]
      operationId: getDeviceConfig
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Current device configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
    put:
      summary: Update actuator configuration
      description: Implemented.
      tags: [Configuration]
      operationId: updateDeviceConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfig"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceConfig"
  /api/devices/{device_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      summary: Record a device heartbeat
      description: Implemented. Firmware should send this every 15–30 seconds.
      tags: [Devices]
      operationId: createDeviceHeartbeat
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Heartbeat recorded
  /api/devices/{device_id}/status:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      summary: Get current device status
      description: Implemented. `online` is derived from the last heartbeat (within 60 seconds).
      tags: [Devices]
      operationId: getDeviceStatus
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Current online state and actuator configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
x-websockets:
  /ws/dashboard:
    description: Implemented. Open, push-only.
    direction: API service to dashboard
    messages:
      - name: detection
        contentType: application/json
        description: Sent when the API receives a motion detection.
        payload:
          $ref: "#/components/schemas/DashboardDetectionEvent"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Enter API_TOKEN without the Bearer prefix. Local Compose defaults to
        dev-token unless changed in .env. This is a shared token, not an account login.
  responses:
    Unauthorized:
      description: Missing or incorrect bearer token. Use Authorize with the configured API_TOKEN.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: 'Bearer realm="wallace"'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthorized
    BadRequest:
      description: Invalid request body or pagination parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The API could not complete the database operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      description: ESP32 factory MAC address. Reuse the same value across requests.
      example: "A4:CF:12:34:56:78"
      schema:
        type: string
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    DeviceNameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: User-facing label; empty falls back to the MAC address.
          example: Front door
    Device:
      type: object
      required:
        [device_id, name, led_enabled, buzzer_enabled, online, last_heartbeat]
      properties:
        device_id:
          type: string
          description: Device MAC address.
        name:
          type: string
        led_enabled:
          type: boolean
          example: true
        buzzer_enabled:
          type: boolean
          example: false
        online:
          type: boolean
        last_heartbeat:
          type: [integer, "null"]
          description: Unix timestamp in seconds; null before the first heartbeat.
    DetectionInput:
      type: object
      required: [ts]
      properties:
        ts:
          type: integer
          description: Unix timestamp in seconds
          minimum: 1
          example: 1732300000
    Detection:
      allOf:
        - $ref: "#/components/schemas/DetectionInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
    DeviceConfig:
      type: object
      required: [led_enabled, buzzer_enabled]
      properties:
        led_enabled:
          type: boolean
          example: true
        buzzer_enabled:
          type: boolean
          example: false
    DeviceStatus:
      allOf:
        - $ref: "#/components/schemas/DeviceConfig"
        - type: object
          required: [online, last_heartbeat]
          properties:
            online:
              type: boolean
            last_heartbeat:
              type: [integer, "null"]
              description: Unix timestamp in seconds; null before the first heartbeat.
    DashboardDetectionEvent:
      type: object
      required: [type, device_id, ts]
      properties:
        type:
          type: string
          const: detection
        device_id:
          type: string
        ts:
          type: integer
          description: Unix timestamp in seconds
